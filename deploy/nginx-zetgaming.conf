server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zetgaming.vanvucoder.id.vn;
    ssl_certificate /etc/letsencrypt/live/103.72.56.192/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103.72.56.192/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 6m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    keepalive_timeout 65;
    location ^~ /api/auth/oauth/google {
        proxy_pass http://127.0.0.1:4273;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:4273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.zetgaming.vanvucoder.id.vn;
    ssl_certificate /etc/letsencrypt/live/admin.zetgaming.vanvucoder.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.zetgaming.vanvucoder.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name admin.zetgaming.vanvucoder.id.vn;
    return 301 https://admin.zetgaming.vanvucoder.id.vn$request_uri;
}
